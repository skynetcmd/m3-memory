# Regenerate docs/star-history.svg from the GitHub stargazers API and commit it
# back to main. GitHub now gates star data behind an authenticated token, so the
# anonymous star-history.com embed no longer renders in the README.
#
# IMPORTANT — token: as of 2026-06-30 GitHub limits the stargazers endpoint to a
# repo's own admins/collaborators. The built-in GITHUB_TOKEN is an installation
# token that is NOT treated as an admin/collaborator, so it returns 403 on the
# stargazers `starred_at` data. This workflow therefore uses a repo secret,
# M3_STARGAZER — a fine-grained PAT owned by an admin, with only
# "Metadata: read-only" permission on this repo. Create it at
# https://github.com/settings/tokens?type=beta and add it under
# Settings -> Secrets and variables -> Actions -> New repository secret.
# Until that secret exists the job no-ops (it will not fail the Actions tab).
#
# The generator is idempotent: with no new stars it produces a byte-identical
# SVG, so the commit step is a no-op and no empty commit is created.

# This workflow also refreshes the README download badges (PyPI + GitHub clones)
# via bin/gen_download_badges.py — same schedule, same commit-back. The PyPI count
# needs no token; the GitHub unique-clone count uses the same M3_STARGAZER PAT
# (the traffic API, like the stargazers API, is admin/collaborator-only, so the
# built-in GITHUB_TOKEN returns 403). Both badges are shields "endpoint" JSON
# committed under docs/badges/, so shields renders the number we control.

name: Star history

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Mondays 06:17 UTC
  workflow_dispatch: {}     # manual trigger from the Actions tab

# Default workflow token permission in this repo is read-only; the commit-back
# needs contents: write.
permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate star-history.svg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Don't persist GITHUB_TOKEN into .git/config — it can leak via uploaded
          # artifacts (zizmor artipacked). This job only reads the repo, so it
          # needs no persisted credential. Matches every checkout in publish.yml.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check for star-history token
        id: token
        env:
          M3_STARGAZER: ${{ secrets.M3_STARGAZER }}
        run: |
          if [ -z "$M3_STARGAZER" ]; then
            echo "M3_STARGAZER secret is not set — skipping star-history refresh."
            echo "The built-in GITHUB_TOKEN cannot read the stargazers endpoint"
            echo "(GitHub restricts it to admins/collaborators). Add a fine-grained"
            echo "PAT with Metadata:read as the M3_STARGAZER secret to enable."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PRESENT is not the same as WORKS. This workflow failed EVERY Monday
          # from at least 2026-08-10 to 2026-09-07 — five silent failures, ~13s
          # each, on `GitHub API 403 for skynetcmd/m3-memory: Forbidden`, while
          # the README quietly served seven-week-old numbers. Nobody watches a
          # green cron; nobody watches a red one either, unless it says why.
          #
          # The cause is NOT expiry and NOT scope. Checked directly on
          # 2026-09-08: the M3_STARGAZER PAT has NO expiration date, was "last
          # used within the last week", is scoped to exactly this repository,
          # and carries "Read access to metadata" — precisely what the header
          # above prescribes. The secret's timestamp matches the token's
          # creation date, so the secret does hold that token. Why GitHub still
          # answers 403 for it in Actions is UNRESOLVED; do not "fix" this by
          # rotating a healthy token.
          #
          # Probe the endpoint the generator ACTUALLY calls (/stargazers with
          # the starred_at media type), not /repos/{repo}. They have different
          # access rules — that is the whole problem here — so a probe against
          # the wrong one can pass while the real call 403s, which would make
          # this guard worse than none.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
                    -H "Authorization: Bearer $M3_STARGAZER" \
                    -H "Accept: application/vnd.github.v3.star+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -H "User-Agent: m3-star-history-generator" \
                    "https://api.github.com/repos/${{ github.repository }}/stargazers?per_page=1")"
          if [ "$code" = "200" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=M3_STARGAZER cannot read the stargazers endpoint::GitHub returned HTTP $code for /stargazers with the starred_at media type. Badge refresh is DISABLED and README badges will go stale. Check the token's repository access and Metadata:read permission BEFORE rotating — a healthy token has already been ruled out once (2026-09-08)."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # TWO outputs, both referenced by the README and easy to forget:
      #   docs/star-history.svg        — the large chart near the bottom
      #   docs/badges/star-history.svg — the small badge in Quick Links
      # Until 2026-09-08 this step wrote only the first, so the BADGE went stale
      # even on runs that succeeded. It was regenerated by hand for seven weeks
      # without anyone noticing the workflow was not maintaining it.
      - name: Regenerate star-history.svg (chart + badge)
        if: steps.token.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.M3_STARGAZER }}
        run: |
          python bin/gen_star_history.py --repo "${{ github.repository }}" --out docs/star-history.svg
          python bin/gen_star_history.py --repo "${{ github.repository }}" --out docs/badges/star-history.svg

      # Refresh the README download badges (PyPI total + GitHub unique clones).
      # Runs even when the star token is absent: the PyPI count needs no token,
      # and the generator skips the clone badge gracefully without one. When the
      # M3_STARGAZER PAT IS present it's passed as GITHUB_TOKEN so the (admin-only)
      # traffic API resolves and the running clone total accumulates.
      - name: Refresh download badges
        env:
          GITHUB_TOKEN: ${{ secrets.M3_STARGAZER }}
        run: python bin/gen_download_badges.py --repo "${{ github.repository }}" --package m3-memory

      - name: Commit if changed
        run: |
          # Stage every asset either generator may have touched; commit only if
          # something actually changed (idempotent — no empty commits).
          git add docs/star-history.svg docs/badges/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No badge/chart changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(badges): refresh star history + download counts [skip ci]"
          git push
