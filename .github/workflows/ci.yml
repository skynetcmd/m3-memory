name: M3 Memory CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff
      # bench_*.py / benchmark_*.py are excluded: they carry the same mechanical
      # lint debt, but editing them trips the pre-push bench-data guard (their
      # source references private benchmark dataset paths). Lint them via a
      # separate bench-aware change, not the standard CI gate.
      run: ruff check bin/ memory/ --exclude 'bench_*.py' --exclude 'benchmark_*.py'

  typecheck:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install types-PyYAML
    - name: Run Mypy
      run: mypy bin/ --ignore-missing-imports

  security:
    name: Security scan (Bandit + pip-audit on core deps)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
        cache: 'pip'

    # Bandit: static analysis on all code paths. Config (skips, exclusions)
    # lives in pyproject.toml under [tool.bandit].
    - name: Install Bandit
      run: pip install "bandit[toml]"
    - name: Run Bandit
      # Bandit SILENTLY SKIPS a file it cannot parse and still exits 0.
      # Measured 2026-09-12: a directory containing one syntax-error file
      # reported "No issues identified." with exit 0 while that file was never
      # scanned -- a security gate reporting clean over code it never read.
      # So the JSON is the verdict, not the exit code: fail on any skipped file.
      run: |
        bandit -c pyproject.toml -r bin/ m3_memory/ -f json -o bandit.json || true
        python - <<'PY'
        import json, sys
        d = json.load(open("bandit.json"))
        errs = d.get("errors") or []
        res = d.get("results") or []
        for e in errs:
            print(f"::error file={e.get('filename')}::bandit could not scan this file: {e.get('reason')}")
        for r in res:
            print(f"::error file={r['filename']},line={r['line_number']}::"
                  f"{r['test_id']} {r['issue_severity']}: {r['issue_text']}")
        if errs:
            sys.exit(f"Bandit SKIPPED {len(errs)} file(s) it could not parse. "
                     f"An unscanned file is not a clean file.")
        if res:
            sys.exit(f"Bandit found {len(res)} issue(s).")
        print(f"Bandit clean: {d['metrics']['_totals']['loc']} lines scanned, 0 skipped.")
        PY

    # pip-audit: scoped to CORE deps only (no [dev] / no opt-in rerank
    # path). Bench/dev transitive CVEs (e.g. transformers, lxml) shouldn't
    # gate merges since they don't reach end users; but a CVE in a real
    # shipped dep should fail the build immediately. We install the
    # package itself (core deps only — no extras) into a clean venv, then
    # audit only the locally-installed transitive tree (-l). The local
    # flag also skips m3-memory itself, which would otherwise fail audit
    # before its release lands on PyPI (chicken-and-egg in pre-release CI).
    - name: Install M3 (core deps only) into a clean venv
      run: |
        python -m venv /tmp/m3-core
        /tmp/m3-core/bin/pip install --upgrade pip
        # Install M3 to pull its core dependencies, then uninstall the
        # package itself. pip-audit -l would otherwise try to look up
        # m3-memory on PyPI and fail with "not found" before each release
        # tag is published (chicken-and-egg in pre-release CI).
        /tmp/m3-core/bin/pip install .
        /tmp/m3-core/bin/pip uninstall -y m3-memory
        /tmp/m3-core/bin/pip install pip-audit
    - name: pip-audit (core deps, locally installed)
      # CVE-2026-3219: pip itself — present because pip is in every venv,
      # but pip is not a shipped runtime dependency of m3-memory. Ignored
      # so the audit signal stays focused on actual shipped-library CVEs.
      #
      # PYSEC-2025-183: pyjwt "weak encryption" — affects ALL pyjwt versions
      # (0.1.1–2.12.1) with no fixed version published, so it cannot be
      # resolved by upgrading. The advisory is disputed by the pyjwt
      # maintainers: the concern is the key length chosen by the calling
      # application, not a flaw in the library. m3-memory's own code never
      # imports `jwt`; pyjwt is present only transitively via the `mcp`
      # core dependency, so the weak-key-length path is not reachable
      # through m3-memory. Ignored; revisit if pyjwt ships a real fix.
      run: /tmp/m3-core/bin/pip-audit --strict -l --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2025-183

  # Emit the test matrix based on event type. Pull requests run the FLOOR
  # (ubuntu + 3.12) for quick feedback; pushes to main/release run the full
  # OS × Python grid so cross-platform coverage still gates the branch
  # everything merges into.
  #
  # THE PR CELL MUST BE THE DECLARED FLOOR, not a convenient middle version.
  # When the floor was 3.11 and PRs ran only 3.12, a 3.12-only construct
  # (`StorageBackend.__protocol_attrs__`, added in CPython 3.12) merged green
  # and then failed the 3.11 lane on THREE consecutive main pushes before
  # anyone looked. A version we promise but never gate on will break silently.
  # If requires-python moves, move this cell with it.
  #
  # THE SAME THING HAPPENED AGAIN, 2026-09-13 — this time to the version list.
  # pyproject classifies 3.12/3.13/3.14/3.15 as supported, but the matrix ran
  # 3.12/3.13/3.15: **3.14, the current stable and the version most users are
  # actually on, was claimed and never gated.** Meanwhile the 3.15 cell failed
  # at setup (rc-only, see allow-prereleases below) on every push, so the job
  # was permanently red and three real CI failures went unnoticed until someone
  # read the Actions tab by hand.
  #
  # THIS LIST IS A SUPERSET of pyproject's "Programming Language :: Python ::"
  # classifiers, and the difference is deliberate:
  #
  #   classifiers = what we PROMISE works (3.12, 3.13, 3.14)
  #   this matrix = that, PLUS the next version we are watching (3.15)
  #
  # Never claim a version this matrix does not run. The reverse is fine and is
  # the point: the 3.15 cell is an early-warning probe. It currently fails at
  # Install Dependencies because torch publishes no cp315 wheel yet — m3's own
  # code is fine there — so 3.15 is NOT classified as supported. When that cell
  # goes green, torch has shipped and the classifier can be restored.
  #
  # A red-forever lane is otherwise worse than no lane: it trains everyone to
  # ignore the one that matters (DESIGN_PHILOSOPHIES §3 — a false alarm is a
  # violation, not a safe default). This one is tolerated ONLY because it is
  # blocked upstream, the cause is named here, and its going green is the
  # signal we want.
  matrix-setup:
    name: Resolve test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"os":["ubuntu-latest"],"python-version":["3.12"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.12","3.13","3.14","3.15"]}' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test on ${{ matrix.os }} (py${{ matrix.python-version }})
    needs: [lint, typecheck, matrix-setup]
    runs-on: ${{ matrix.os }}
    # The 3.15 cell is a CANARY, not a gate — see the matrix-setup block above
    # for why it exists and why it currently fails (torch ships no cp315 wheel,
    # so pip dies before a test runs).
    #
    # That block already names the cost: a red-forever lane trains everyone to
    # ignore the one that matters, which is the §3 false alarm. It was tolerated
    # on the grounds that the cause is documented — but tolerating it still left
    # main permanently red, so a genuine regression had nothing to contrast
    # against. Non-blocking resolves that without losing the probe: the lane
    # still runs and still reports, it just no longer gates.
    #
    # When torch ships cp315 the cell goes green on its own; drop this line and
    # restore the classifier together. 3.12/3.13/3.14 stay blocking — those are
    # the versions pyproject.toml actually claims.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        # 3.15 is in its release-candidate window (3.15.0 final: 2026-10-01,
        # PEP 790). The runners publish 14 builds of it, but EVERY ONE is
        # stable=false, and a bare "3.15" matches stable builds only — so
        # setup-python failed with "The version '3.15' ... was not found"
        # before a single test ran, on every push, on all three OSes.
        #
        # allow-prereleases resolves it to the newest rc today and switches to
        # the stable build automatically once it ships, with no follow-up edit.
        # Pinning "3.15.0-rc.2" instead would go stale the moment it lands.
        #
        # It is deliberately NOT scoped to 3.15: the flag only has an effect
        # when no stable build matches, so 3.12/3.13/3.14 keep resolving to
        # their stable releases exactly as before.
        allow-prereleases: true
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest (hermetic lane)
      # The hermetic unit lane: everything that needs no external service and is
      # not timing-sensitive.
      #  - `not integration` excludes tests needing a live service (requires_pg /
      #    requires_embedder / requires_gguf / requires_files_db) — GH runners
      #    provision none, so they'd only self-skip. Run them on a dev box (or a
      #    future services job) with `pytest -m integration`.
      #  - `not slow` excludes the perf tests (test_chatlog_perf). Their wall-clock
      #    budgets (e.g. enqueue < 200ms) assume a quiet, dedicated host; a shared
      #    ubuntu-latest runner misses them intermittently (measured 213ms vs 200ms
      #    budget — a scheduling flake, not a regression). Perf belongs on a
      #    baseline-stable host, not the PR gate. Run locally with `pytest -m slow`.
      # --strict-markers makes a typo'd marker a hard error.
      # See docs/design/TEST_SUITE_DESIGN.md.
      run: |
        pytest tests/ -m "not integration and not slow"

  # ── PostgreSQL lane ─────────────────────────────────────────────────────────
  # m3 ships SQLite + PostgreSQL by contract, but until now CI provisioned no
  # PG, so every `requires_pg` test SELF-SKIPPED and the suite reported green
  # having exercised one of the two backends. A PG migration could be merged and
  # released having never been executed — only read.
  #
  # That is not hypothetical. 2026-09-12: `pg_054_notification_received_at`
  # shipped on static review alone, and a sibling defect in the same feature
  # (`now()` hand-written into a shared code path) would have failed at runtime
  # on SQLite. Neither was caught by a green suite.
  #
  # REQUIRED as of 2026-09-22. It began advisory (`continue-on-error: true`)
  # because it had never run in CI and making it blocking on its first outing
  # would have failed every PR on untriaged defects. The bar set here was "green
  # across a few PRs"; that is now met, and the intervening history is the
  # argument rather than the elapsed time:
  #
  #   2b0c082b  skipped   <- the typecheck gate above failed, so it never ran
  #   f1db8d29  failure   } all three the SAME pre-existing defect: the dispatch
  #   3810899e  failure   } table name was bound at module scope, so it captured
  #   941d3ee8  failure   } postgres while the connection resolved sqlite
  #   cd5b5a27  success   <- that defect fixed
  #   99d90d21  success
  #
  # One root cause, fixed, and every run since is green. Nothing else has ever
  # failed in this lane. Leaving it advisory now would be the §3 failure in the
  # other direction: a lane nobody has to care about is a lane that stops being
  # read, and this is the only coverage m3 has for one of its two shipped
  # backends (§0.4). A PG migration must not be able to merge unexecuted again.
  #
  # ⚠ If this lane starts failing for a NEW reason, fix the defect — do not
  # restore `continue-on-error`. That silences the one gate that proves m3 still
  # works on PostgreSQL.
  postgres:
    name: PostgreSQL lane (requires_pg)
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: m3dev
          POSTGRES_PASSWORD: m3devpass
          POSTGRES_DB: m3_citest
        # Without the health gate the job races the server's first-boot
        # initialisation and the reachability probe caches a false negative for
        # the WHOLE session — which would silently skip every test here and
        # report the lane green. The failure mode this lane exists to remove.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" psycopg2-binary
    - name: Confirm the cluster is actually reachable
      # Fail LOUD here rather than let pytest skip its way to a green lane. A
      # requires_pg run that skips everything is indistinguishable from a pass,
      # and that ambiguity is the whole reason #160 was filed.
      env:
        M3_PRIMARY_PG_URL: postgresql://m3dev:m3devpass@localhost:5432/m3_citest
      run: |
        python - <<'PY'
        import os, sys, psycopg2
        dsn = os.environ["M3_PRIMARY_PG_URL"]
        with psycopg2.connect(dsn, connect_timeout=10) as c:
            v = c.cursor(); v.execute("SELECT version()")
            print(v.fetchone()[0])
        PY
    - name: Assert the SEAM resolves to postgres, not just that PG is reachable
      # The reachability probe above answers a question ADJACENT to the one that
      # matters. Measured 2026-09-13: this lane set M3_PRIMARY_PG_URL but NOT
      # M3_DB_BACKEND, so `resolve_backend_name()` returned 'sqlite' -- a job
      # named "PostgreSQL lane" that ran SQLite and reported green. A declared
      # guarantee with no enforcement site is a lie the tests cannot see (§3).
      env:
        M3_DB_BACKEND: postgres
        M3_PRIMARY_PG_URL: postgresql://m3dev:m3devpass@localhost:5432/m3_citest
      run: |
        python - <<'PY'
        import sys
        sys.path.insert(0, "bin")
        from memory.backends.selector import resolve_backend_name
        from memory.backends import dialect
        name = resolve_backend_name()
        param = dialect().param()
        print(f"observed: backend={name!r} param={param!r}")
        if name != "postgres" or param != "%s":
            sys.exit(
                f"the seam resolved to {name!r} (param {param!r}) -- this lane "
                f"would have tested SQLite while calling itself the PostgreSQL "
                f"lane. Refusing to report a result for a backend it never ran."
            )
        print("confirmed: the suite below runs against PostgreSQL")
        PY

    - name: Run the FULL suite against PostgreSQL
      env:
        M3_DB_BACKEND: postgres
        M3_PRIMARY_PG_URL: postgresql://m3dev:m3devpass@localhost:5432/m3_citest
      # The whole suite, not `-m requires_pg`. Measured 2026-09-13: the marker
      # selected 102 of 4,307 tests (2.4%). The other 4,205 are not
      # SQLite-specific -- they exercise the storage seam against WHATEVER
      # backend is configured, and had never run against PostgreSQL in CI.
      #
      # That gap is not hypothetical: the first honest full run surfaced 16 real
      # failures (#171, pg_sync rendering %s onto a SQLite cursor), none of
      # which the 102-test marker lane could reach.
      #
      # -m "not integration" excludes suites whose SERVICE is absent here
      # (embedder, gguf, files_db); those would only self-skip and re-create the
      # ambiguity this lane exists to remove.
      run: |
        pytest tests/ -m "not integration" -p no:cacheprovider -q

    - name: Run the requires_pg suites
      env:
        M3_DB_BACKEND: postgres
        M3_PRIMARY_PG_URL: postgresql://m3dev:m3devpass@localhost:5432/m3_citest
      # ⚠ THE STEP ABOVE CANNOT REACH THESE. `-m "not integration"` is correct
      # for suites whose SERVICE is missing here, but the collection hook gives
      # EVERY capability-marked test the `integration` umbrella -- including
      # requires_pg. So the lane that exists to exercise PostgreSQL was
      # deselecting every test written specifically for PostgreSQL: measured
      # 2026-09-19, all 16 of test_memory_dynamics_pg_live were deselected by
      # that filter, and the *_pg_live.py files generally.
      #
      # The cluster IS reachable in this job (asserted two steps up), so these
      # cannot self-skip into a false green the way they would elsewhere. That
      # is also why this runs as its own step: a skip here is a real signal.
      #
      # --no-skip-ok: a run that SKIPS everything exits 0 and is
      # indistinguishable from a pass, which is the exact ambiguity #160 was
      # filed about. Assert a real collection instead of trusting the exit code.
      run: |
        pytest tests/ -m requires_pg -p no:cacheprovider -q --junitxml=pg-marker.xml
        python - <<'PY'
        import sys, xml.etree.ElementTree as ET
        root = ET.parse("pg-marker.xml").getroot()
        # `find(...) or root` would warn (and eventually break): an Element with
        # no children is falsy. Compare to None explicitly.
        s = root.find("testsuite")
        if s is None:
            s = root
        ran = int(s.get("tests", 0)) - int(s.get("skipped", 0))
        print(f"requires_pg: {s.get('tests')} collected, {s.get('skipped')} skipped, {ran} executed")
        if ran < 50:
            sys.exit(
                f"only {ran} requires_pg tests actually executed. The cluster is "
                f"reachable in this job, so a skip means the marker or the "
                f"fixture stopped resolving -- not an absent service."
            )
        PY

  # ── End-to-end install ──────────────────────────────────────────────────────
  # The unit lane covers the install PIECES; nothing exercised the whole path.
  # test_install_no_clobber deliberately swallows wiring failures
  # ("post-fetch wiring may raise in the isolated env; data safety is what we
  # assert"), so an install that completes and leaves a NON-FUNCTIONAL system
  # passes every existing test. That is exactly how a broken install reaches a
  # user: `m3 setup` used to discard the doctor's verdict and exit 0 regardless.
  #
  # This job installs the package the way a user does, runs the real wizard
  # unattended against THROWAWAY roots, and requires it to exit 0 — which now
  # means "installed AND `m3 doctor` passed". Exit 3 (installed but unverified)
  # fails the build.
  #
  # Runs on all three OSes on push: the failures that motivated it were
  # platform-specific (Windows file locks, venv launcher stubs, POSIX-only
  # asyncio signal handlers), so a single-OS lane would have missed them.
  e2e-install:
    # A HANG must not burn a 6-hour runner. The Windows lane sat in_progress for
    # 25+ minutes on a step whose ubuntu/macOS twins finish in well under 10 —
    # the failure mode is a BLOCK, not a crash, and without a cap every failing
    # run costs six hours and delays the post-mortem steps that explain it.
    timeout-minutes: 25
    name: E2E install + upgrade on ${{ matrix.os }}
    needs: [lint, typecheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # OS-only, ONE Python — deliberately NOT the shared test matrix.
      #
      # This job asks "does installing m3 the way a user does still work", and
      # the answer is OS-specific (Windows file locks, venv launcher stubs,
      # POSIX-only asyncio signal handlers), never Python-version-specific —
      # note the job name carries {os} and no python version, because the extra
      # dimension only ever produced duplicate rows.
      #
      # Worse, it made the job test a environment no user has. Sharing the
      # matrix put N Pythons on the runner's PATH, and on 2026-09-13 m3's own
      # preflight caught it and aborted, exactly as designed:
      #
      #   [!] launcher shadowing: more than one m3 install is on PATH.
      #       m3 (shadowed): .../Python/3.15.0-rc.2/arm64/bin/m3
      #         — also on PATH: /Library/Frameworks/.../bin/m3
      #   [X] setup aborted by preflight
      #
      # That is a TRUE POSITIVE about the runner, not about m3 — and a real
      # user install would never look like that. The hermetic `test` job above
      # is what carries Python-version coverage.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        # Same reason as the test job above: this job consumes the SAME matrix,
        # so it gets the 3.15 cell too and a bare "3.15" resolves to nothing
        # while 3.15 is rc-only. Both setup-python steps that take a matrix
        # version need this flag — fixing only one left these three E2E lanes
        # failing at "Set up Python 3.15" while the test lanes had moved on to
        # the real (torch) blocker.
        allow-prereleases: true
        cache: 'pip'

    - name: Install m3-memory from source (as a user would)
      run: |
        python -m pip install --upgrade pip
        pip install .

    # Roots live under the runner temp dir, never the default ~/.m3, so the
    # wizard cannot touch anything outside this job and each run starts clean.
    - name: Run the setup wizard unattended (throwaway roots)
      shell: bash
      env:
        # No agent is installed on a runner, so wire none and disable capture:
        # the point is the install path itself, not hook wiring into a client
        # that is not there.
        M3_E2E_ROOT: ${{ runner.temp }}/m3-e2e
        # Breadcrumbs to a FILE: the Windows failure kills setup with no output
        # on either stream, so anything relying on the dying process flushing
        # its own stdio is precisely what cannot be trusted here.
        M3_TRACE_FILE: ${{ runner.temp }}/m3-setup-trace.log
      run: |
        mkdir -p "$M3_E2E_ROOT/config" "$M3_E2E_ROOT/engine"
        # --no-native-wheel: runners have no GPU and a source build is slow;
        #   the pure-Python path is what we are gating here.
        # --no-shared-embedder / --no-dashboard / --no-governor-migration:
        #   long-lived services and OS scheduler entries are not the subject
        #   of this test and would leak state on a shared runner.
        # Invoke the MODULE, not the `m3` console script. On Windows the script's
        # UTF-8 re-exec SPAWNS a child rather than replacing the image, so the
        # launcher generation stays alive as a registered m3 process for the whole
        # run. Setup's preflight then finds its own PARENT holding the DB and
        # correctly refuses to kill it — exit 2, "cannot quiesce mcp(pid N): it is
        # this install's own parent process". `python -m m3_memory.cli` has no
        # launcher generation. This is exactly the advice setup itself prints for
        # this case, so CI should follow it.
        python -m m3_memory.cli setup \
          --non-interactive --terminal \
          --agents "" --capture-mode none \
          --no-native-wheel --no-shared-embedder \
          --no-dashboard --no-governor-migration \
          --force-quiesce \
          --decouple-roots \
          --config-root "$M3_E2E_ROOT/config" \
          --engine-root "$M3_E2E_ROOT/engine"

    # The Windows lane has never been green and its failure mode is a SILENT
    # one: the log ends at "Step 5/5" with exit 1 and no verdict. Print the
    # doctor's own exit code and output on that runner so the next failure
    # names itself instead of needing another CI round-trip to diagnose.
    - name: Dump the setup trace (always — this is the post-mortem)
      if: always()
      shell: bash
      run: |
        f="${{ runner.temp }}/m3-setup-trace.log"
        echo "--- setup trace ($f) ---"
        if [ -f "$f" ]; then cat "$f"; else echo "(no trace file written)"; fi

    - name: Diagnose verification (Windows only, never fails the job)
      # `always()` is REQUIRED: without it a step is skipped once an earlier one
      # fails, and the whole point of this step is to explain the setup failure
      # that just happened. Placed after setup, it never ran on the very runs it
      # exists to diagnose.
      if: always() && runner.os == 'Windows'
      shell: bash
      env:
        M3_E2E_ROOT: ${{ runner.temp }}/m3-e2e
      run: |
        export M3_CONFIG_ROOT="$M3_E2E_ROOT/config"
        export M3_ENGINE_ROOT="$M3_E2E_ROOT/engine"
        echo "--- m3 doctor (scoped, exactly as setup runs it) ---"
        m3 doctor --skip-shared-embedder --skip-cascade; echo "doctor exit=$?"
        echo "--- the same invocation setup uses, via -m ---"
        python -m m3_memory.cli doctor --skip-shared-embedder --skip-cascade
        echo "python -m doctor exit=$?"
        # The setup step's child dies writing NOTHING — not one byte reaches the
        # log, on a step whose ubuntu twin streams the full doctor report. The
        # steps above run that same command standalone and both exit 0, so the
        # difference is the CHILD-OF-SETUP context, not the command. Reproduce
        # it: spawn exactly as _step_doctor does, with the parent's re-exec
        # sentinel present, and CAPTURE both streams instead of streaming them.
        echo "--- as a CHILD, with the parent's UTF-8 re-exec sentinel set ---"
        cat > "$RUNNER_TEMP/probe_child.py" <<'PYEOF'
        import os, subprocess, sys
        argv = [sys.executable, "-m", "m3_memory.cli", "doctor",
                "--skip-shared-embedder", "--skip-cascade"]
        print("sentinel:", os.environ.get("_M3_UTF8_REEXEC"))
        r = subprocess.run(argv, capture_output=True, text=True,
                           errors="backslashreplace")
        print("rc:", r.returncode)
        print("stdout[:400]:", repr(r.stdout[:400]))
        print("stderr[:800]:", repr(r.stderr[:800]))
        PYEOF
        sed -i 's/^        //' "$RUNNER_TEMP/probe_child.py"
        _M3_UTF8_REEXEC=1 python "$RUNNER_TEMP/probe_child.py" || true
        echo "--- engine root ---"
        ls -la "$M3_E2E_ROOT/engine" || true
        echo "--- config root ---"
        ls -la "$M3_E2E_ROOT/config" || true

    # Belt-and-braces: setup's own exit code already encodes this, but assert
    # the resulting install is independently usable rather than trusting the
    # installer to grade its own work.
    - name: Verify the install is actually functional
      shell: bash
      env:
        M3_E2E_ROOT: ${{ runner.temp }}/m3-e2e
      run: |
        export M3_CONFIG_ROOT="$M3_E2E_ROOT/config"
        export M3_ENGINE_ROOT="$M3_E2E_ROOT/engine"
        set -x
        m3 --version
        # `m3 status` returns 1 on "degraded" BY DESIGN (installer.status:
        # "Returns 0 healthy, 1 degraded/broken"). This job installs with
        # --no-native-wheel --no-shared-embedder, so the result is degraded on
        # purpose: pure-Python embeds, no :8082. Asserting exit 0 here demands
        # the opposite of what the flags above requested — and under `set -e`
        # it killed the step before `m3 doctor` even ran. Keep the output for
        # the log, but do not gate on a verdict this job engineered.
        m3 status || true
        # Grade only what this job installed. The setup above passes
        # --no-shared-embedder, so the shared-embedder probe and the
        # embedder-dependent probes (embedding-cascade, and the file-extraction
        # LLM probe nested inside it) all report the ABSENCE we asked for and
        # return 1. Demanding them here would fail the job for honouring its own
        # flags. Every other probe still runs and still gates this step.
        m3 doctor --skip-shared-embedder --skip-cascade
        # The store must be writable and searchable end to end, not merely present.
        m3 memory memory_write --content "e2e canary" --type note
        m3 memory memory_search --query "e2e canary" --k 1 | grep -q "e2e canary"

    # ── Upgrade over the install we just made ────────────────────────────────
    # This is the path that actually breaks in the field: a reinstall on top of
    # a POPULATED install, with the previous version's artifacts still on disk.
    # A fresh install exercises none of it — no existing DBs to migrate or
    # clobber, no already-registered schedules, no stale bytecode, no running
    # writers. Every incident that motivated this job happened on an upgrade.
    #
    # Two things must hold, and they are different claims:
    #   1. the upgrade completes AND verifies (exit 0, not 3)
    #   2. the data written before it is still there afterwards
    # (2) is the one that matters most and the one a "did it exit 0" check
    # cannot see: a wipe-and-recreate would pass every other assertion here.
    - name: Re-run setup over the existing install (upgrade path)
      shell: bash
      env:
        M3_E2E_ROOT: ${{ runner.temp }}/m3-e2e
      run: |
        # Record the pre-upgrade state so a silent data loss is visible even if
        # the canary search were to pass for the wrong reason.
        export M3_CONFIG_ROOT="$M3_E2E_ROOT/config"
        export M3_ENGINE_ROOT="$M3_E2E_ROOT/engine"
        echo "engine root before upgrade:"
        ls -la "$M3_E2E_ROOT/engine"
        # Invoke the MODULE, not the `m3` console script. On Windows the script's
        # UTF-8 re-exec SPAWNS a child rather than replacing the image, so the
        # launcher generation stays alive as a registered m3 process for the whole
        # run. Setup's preflight then finds its own PARENT holding the DB and
        # correctly refuses to kill it — exit 2, "cannot quiesce mcp(pid N): it is
        # this install's own parent process". `python -m m3_memory.cli` has no
        # launcher generation. This is exactly the advice setup itself prints for
        # this case, so CI should follow it.
        python -m m3_memory.cli setup \
          --non-interactive --terminal \
          --agents "" --capture-mode none \
          --no-native-wheel --no-shared-embedder \
          --no-dashboard --no-governor-migration \
          --force-quiesce \
          --decouple-roots \
          --config-root "$M3_E2E_ROOT/config" \
          --engine-root "$M3_E2E_ROOT/engine"

    - name: Verify the upgrade preserved data and left a working install
      shell: bash
      env:
        M3_E2E_ROOT: ${{ runner.temp }}/m3-e2e
      run: |
        export M3_CONFIG_ROOT="$M3_E2E_ROOT/config"
        export M3_ENGINE_ROOT="$M3_E2E_ROOT/engine"
        set -x
        # The memory written BEFORE the upgrade must still be searchable. This
        # is the load-bearing assertion: it fails on a wipe-and-recreate, on a
        # migration that drops rows, and on an engine root silently relocated
        # out from under the data.
        m3 memory memory_search --query "e2e canary" --k 1 | grep -q "e2e canary"
        # And the install must still be healthy, not merely intact.
        # Same scoping as the first verify step — see the note there.
        m3 doctor --skip-shared-embedder --skip-cascade
        # A second write must work too — a store that survived but is now
        # read-only or schema-broken is still a broken upgrade.
        m3 memory memory_write --content "post-upgrade canary" --type note
        m3 memory memory_search --query "post-upgrade canary" --k 1 | grep -q "post-upgrade canary"

    - name: Show the engine root on failure
      if: failure()
      shell: bash
      env:
        M3_E2E_ROOT: ${{ runner.temp }}/m3-e2e
      run: |
        ls -la "$M3_E2E_ROOT/engine" || true
        ls -la "$M3_E2E_ROOT/config" || true
